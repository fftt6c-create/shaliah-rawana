<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5f">
<title>Rawana - إدارة الشاليه</title>

<style>
:root{
  --primary:#1f6f5f;
  --primary-dark:#174f44;
  --bg:#f5f7f8;
  --card:#ffffff;
  --text:#17201d;
  --muted:#78837f;
  --border:#e5e9e7;
  --danger:#d94b4b;
  --success:#29965d;
  --warning:#e3a52d;
  --shadow:0 8px 30px rgba(20,40,35,.07);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  padding-bottom:90px;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* ================= HEADER ================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:45px;
  height:45px;
  border-radius:14px;
  background:linear-gradient(145deg,var(--primary),var(--primary-dark));
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 8px 20px rgba(31,111,95,.25);
}

.brand-title{
  font-size:18px;
  font-weight:900;
}

.brand-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:white;
  border-radius:13px;
  font-size:19px;
}

/* ================= CONTENT ================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:22px 18px 35px;
}

.title{
  font-size:28px;
  font-weight:950;
  margin-bottom:5px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:22px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.page-head .subtitle{
  margin-bottom:0;
}

/* ================= BUTTONS ================= */

.primary,
.secondary,
.success,
.danger,
.warning{
  border:0;
  border-radius:13px;
  padding:12px 17px;
  font-weight:800;
  transition:.2s;
}

.primary{
  background:var(--primary);
  color:#fff;
}

.primary:hover{
  background:var(--primary-dark);
}

.secondary{
  background:#eef2f0;
  color:var(--text);
}

.success{
  background:#e7f7ee;
  color:#197544;
}

.danger{
  background:#ffeded;
  color:#bd3333;
}

.warning{
  background:#fff5db;
  color:#9b6b12;
}

.primary:active,
.secondary:active,
.success:active,
.danger:active{
  transform:scale(.97);
}

/* ================= DASHBOARD ================= */

.hero{
  background:
    radial-gradient(circle at top left,rgba(255,255,255,.25),transparent 30%),
    linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
  border-radius:25px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 15px 35px rgba(31,111,95,.18);
}

.hero h1{
  margin:0;
  font-size:27px;
}

.hero p{
  margin:7px 0 0;
  opacity:.8;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-card{
  display:flex;
  gap:14px;
  align-items:center;
}

.stat-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#eef6f3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.label{
  color:var(--muted);
  font-size:13px;
}

.value{
  font-size:22px;
  font-weight:950;
  margin-top:4px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:18px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.quick-card{
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  background:#fff;
  cursor:pointer;
}

.quick-icon{
  font-size:27px;
  margin-bottom:8px;
}

.quick-title{
  font-weight:900;
}

.quick-text{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

/* ================= LISTS ================= */

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:0 4px 18px rgba(20,40,35,.04);
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:15px;
  background:#edf5f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.grow{
  flex:1;
}

.item-title{
  font-weight:900;
}

.item-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  margin-top:3px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

/* ================= STATUS ================= */

.status{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}

.status.confirmed{
  background:#e7f7ee;
  color:#177344;
}

.status.pending{
  background:#fff4dc;
  color:#966b15;
}

.status.cancelled{
  background:#ffebeb;
  color:#b62f2f;
}

/* ================= FORMS ================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:13px;
  font-weight:800;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:13px;
  padding:13px 14px;
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(31,111,95,.08);
}

textarea{
  resize:vertical;
  min-height:100px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(10,20,18,.5);
  backdrop-filter:blur(5px);
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(720px,100%);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:25px;
  padding:20px;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
  font-size:21px;
}

.close{
  border:0;
  background:#f0f2f1;
  width:40px;
  height:40px;
  border-radius:12px;
  font-size:23px;
}

/* ================= CALENDAR ================= */

.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.calendar-title{
  font-size:20px;
  font-weight:950;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.day-name{
  text-align:center;
  font-weight:900;
  color:var(--muted);
  padding:8px 2px;
  font-size:12px;
}

.day{
  min-height:75px;
  border-radius:13px;
  padding:7px;
  border:1px solid var(--border);
  background:#fff;
  cursor:pointer;
  position:relative;
}

.day-number{
  font-weight:950;
  font-size:15px;
}

.day.available{
  background:var(--calendar-available,#e9f8ee);
}

.day.booked{
  background:var(--calendar-booked,#ffe7e7);
  border-color:rgba(200,50,50,.25);
}

.day.weekend{
  background:var(--calendar-weekend,#fff4c7);
}

.day.booked.weekend{
  background:
    linear-gradient(
      135deg,
      var(--calendar-booked,#ffe7e7) 50%,
      var(--calendar-weekend,#fff4c7) 50%
    );
}

.day-booking{
  margin-top:7px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ================= FINANCE ================= */

.finance-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.finance-main{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:25px;
  border-radius:22px;
  margin-bottom:18px;
}

.finance-main small{
  opacity:.8;
}

.finance-main strong{
  display:block;
  font-size:34px;
  margin-top:5px;
}

/* ================= SETTINGS ================= */

.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:19px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.section-head{
  margin-bottom:17px;
}

.section-head h3{
  margin:0;
  font-size:17px;
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.setting-row{
  margin-bottom:13px;
}

.setting-row label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
}

.check-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.switch{
  width:48px;
  height:27px;
  border:0;
  border-radius:999px;
  background:#d7ddda;
  position:relative;
}

.switch:after{
  content:"";
  position:absolute;
  top:4px;
  right:4px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch.on{
  background:var(--primary);
}

.switch.on:after{
  right:25px;
}

/* ================= EMPTY ================= */

.empty{
  background:#fff;
  border:1px dashed #ccd5d1;
  border-radius:18px;
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
}

/* ================= CONTRACT / INVOICE ================= */

.document{
  background:#fff;
  border-radius:18px;
  border:1px solid var(--border);
  padding:25px;
  line-height:2;
}

.document-header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid var(--border);
  padding-bottom:18px;
  margin-bottom:20px;
}

.document-brand{
  font-size:22px;
  font-weight:950;
}

.document-title{
  font-size:20px;
  font-weight:950;
}

.signature-box{
  border:1px dashed #cdd4d1;
  border-radius:14px;
  padding:18px;
  min-height:130px;
}

.signature-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:25px;
}

.signature-canvas{
  width:100%;
  height:180px;
  border:1px solid var(--border);
  border-radius:14px;
  touch-action:none;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  padding:
    8px
    max(8px,env(safe-area-inset-right))
    calc(8px + env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
}

.nav-inner{
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  border:0;
  background:none;
  color:#89938f;
  padding:6px 2px;
  font-size:10px;
  font-weight:800;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:var(--primary);
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px){

  .stats,
  .finance-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  .container{
    padding:18px 12px 25px;
  }

  .topbar-inner{
    padding:10px 13px;
  }

  .title{
    font-size:24px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .card{
    padding:14px;
  }

  .value{
    font-size:19px;
  }

  .stat-icon{
    width:42px;
    height:42px;
  }

  .quick-grid{
    grid-template-columns:1fr 1fr;
  }

  .form-grid,
  .settings-grid,
  .signature-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .page-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .page-head button{
    width:100%;
  }

  .item{
    flex-wrap:wrap;
  }

  .item > .grow{
    min-width:calc(100% - 65px);
  }

  .item > .actions{
    width:100%;
  }

  .calendar{
    gap:3px;
  }

  .day{
    min-height:60px;
    padding:5px;
  }

  .day-number{
    font-size:13px;
  }

  .day-booking{
    display:none;
  }

  .modal{
    align-items:flex-end;
  }

  .modal-box{
    border-radius:25px 25px 0 0;
    max-height:92vh;
  }
}

@media(min-width:601px){
  body{
    padding-bottom:20px;
  }

  .bottom-nav{
    position:static;
    border-top:0;
    background:transparent;
    backdrop-filter:none;
  }

  .nav-inner{
    display:flex;
    justify-content:center;
    gap:8px;
    max-width:1200px;
  }

  .nav-btn{
    background:#fff;
    border:1px solid var(--border);
    border-radius:13px;
    padding:9px 15px;
  }

  .nav-icon{
    display:inline;
    margin-left:5px;
  }
}

/* ================= PRINT ================= */

@media print{

  .topbar,
  .bottom-nav,
  .no-print{
    display:none!important;
  }

  body{
    background:#fff;
    padding:0;
  }

  .container{
    max-width:none;
    padding:0;
  }

  .document{
    border:0;
    box-shadow:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <div class="brand-logo">🏡</div>

      <div>
        <div class="brand-title" id="brandName">روانا</div>
        <div class="brand-subtitle" id="brandSubtitle">
          إدارة الشاليه
        </div>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="go('settings')">⚙️</button>
    </div>

  </div>
</header>

<main class="container" id="content"></main>

<nav class="bottom-nav">

  <div class="nav-inner">

    <button class="nav-btn" data-page="home"
      onclick="go('home')">
      <span class="nav-icon">🏠</span>
      الرئيسية
    </button>

    <button class="nav-btn" data-page="bookings"
      onclick="go('bookings')">
      <span class="nav-icon">📅</span>
      الحجوزات
    </button>

    <button class="nav-btn" data-page="calendar"
      onclick="go('calendar')">
      <span class="nav-icon">🗓️</span>
      التقويم
    </button>

    <button class="nav-btn" data-page="invoices"
      onclick="go('invoices')">
      <span class="nav-icon">🧾</span>
      الفواتير
    </button>

    <button class="nav-btn" data-page="settings"
      onclick="go('settings')">
      <span class="nav-icon">⚙️</span>
      الإعدادات
    </button>

  </div>

</nav>

</div>

<!-- ================= MODALS ================= -->

<div class="modal" id="bookingModal">

<div class="modal-box">

<div class="modal-head">

<h2 id="bookingModalTitle">حجز جديد</h2>

<button class="close"
onclick="closeBookingModal()">×</button>

</div>

<div class="form-grid">

<div class="field">
<label>العميل</label>
<select id="bookingClient"></select>
</div>

<div class="field">
<label>حالة الحجز</label>
<select id="bookingStatus">
<option value="confirmed">مؤكد</option>
<option value="pending">معلق</option>
<option value="cancelled">ملغي</option>
</select>
</div>

<div class="field">
<label>تاريخ الدخول</label>
<input type="date" id="bookingStartDate">
</div>

<div class="field">
<label>وقت الدخول</label>
<input type="time" id="bookingStartTime">
</div>

<div class="field">
<label>تاريخ الخروج</label>
<input type="date" id="bookingEndDate">
</div>

<div class="field">
<label>وقت الخروج</label>
<input type="time" id="bookingEndTime">
</div>

<div class="field">
<label>سعر الحجز</label>
<input type="number" id="bookingPrice">
</div>

<div class="field">
<label>المدفوع</label>
<input type="number" id="bookingPaid">
</div>

<div class="field full">
<label>ركن القهوة</label>
<select id="bookingCoffee" multiple style="min-height:100px"></select>
</div>

<div class="field full">
<label>ملاحظات</label>
<textarea id="bookingNotes"></textarea>
</div>

</div>

<div class="actions">

<button class="primary"
onclick="saveBooking()">
حفظ الحجز
</button>

<button class="secondary"
onclick="closeBookingModal()">
إلغاء
</button>

</div>

</div>
</div>

<div class="modal" id="clientModal">

<div class="modal-box">

<div class="modal-head">

<h2 id="clientModalTitle">عميل جديد</h2>

<button class="close"
onclick="closeClientModal()">×</button>

</div>

<div class="form-grid">

<div class="field">
<label>اسم العميل</label>
<input id="clientName">
</div>

<div class="field">
<label>رقم الجوال</label>
<input id="clientPhone" inputmode="tel">
</div>

<div class="field full">
<label>ملاحظات</label>
<textarea id="clientNotes"></textarea>
</div>

</div>

<div class="actions">

<button class="primary"
onclick="saveClient()">
حفظ العميل
</button>

<button class="secondary"
onclick="closeClientModal()">
إلغاء
</button>

</div>

</div>
</div>

<script>

/* =========================================================
   RAWANA DATABASE
========================================================= */

const defaults={

settings:{
name:"روانا",
subtitle:"إدارة الشاليه",
currency:"ر.س",

primary:"#1f6f5f",
dark:"#174f44",
light:"#ffffff",
bg:"#f5f7f8",

calendarAvailable:"#e9f8ee",
calendarBooked:"#ffe7e7",
calendarWeekend:"#fff4c7",

defaultStart:"16:00",
defaultEnd:"04:00",

coffeeName:"ركن القهوة",

contractTitle:"عقد إيجار شاليه",

contractText:
`تم الاتفاق بين الطرفين على استئجار الشاليه.

اسم العميل: {{customerName}}
رقم الجوال: {{customerPhone}}

تاريخ الدخول: {{startDate}}
وقت الدخول: {{startTime}}

تاريخ الخروج: {{endDate}}
وقت الخروج: {{endTime}}

قيمة الحجز: {{price}}
ركن القهوة: {{coffee}}
إجمالي ركن القهوة: {{coffeeTotal}}

الإجمالي: {{total}}
المدفوع: {{paid}}

function loadDB(){

try{

const raw=localStorage.getItem("rawana-db");

if(!raw)
return JSON.parse(JSON.stringify(defaults));

const saved=JSON.parse(raw);

return{
  ...JSON.parse(JSON.stringify(defaults)),
  ...saved,
  settings:{
    ...defaults.settings,
    ...(saved.settings||{})
  },
  bookings:Array.isArray(saved.bookings)?saved.bookings:[],
  clients:Array.isArray(saved.clients)?saved.clients:[],
  invoices:Array.isArray(saved.invoices)?saved.invoices:[],
  contracts:Array.isArray(saved.contracts)?saved.contracts:[],
  coffeeCategories:Array.isArray(saved.coffeeCategories)
    ?saved.coffeeCategories:[],
  expenses:Array.isArray(saved.expenses)?saved.expenses:[]
};

}catch(e){

return JSON.parse(JSON.stringify(defaults));

}

}

function safe(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function money(value){

function formatDateForInput(date){

const y=date.getFullYear();
const m=String(date.getMonth()+1).padStart(2,"0");
const d=String(date.getDate()).padStart(2,"0");

return `${y}-${m}-${d}`;

}

function dateText(date){

if(!date)return"—";

const parts=String(date).split("-");

if(parts.length!==3)return date;

return `${parts[2]}/${parts[1]}/${parts[0]}`;

}

function timeText(time){

if(!time)return"—";

const [h,m]=time.split(":");

let hour=Number(h);
const period=hour>=12?"م":"ص";

hour=hour%12||12;

return `${hour}:${m} ${period}`;

}

function bookingTotal(b){

return Number(b.price||0)+coffeePrice(b);

}

function remaining(b){

return Math.max(
0,
bookingTotal(b)-Number(b.paid||0)
);

}

function coffeePrice(b){

if(!Array.isArray(b.coffee))
return 0;

return b.coffee.reduce((sum,id)=>{

const c=db.coffeeCategories.find(
x=>x.id===id
);

return sum+Number(c?.price||0);

},0);

}

function coffeeNames(b){

if(!Array.isArray(b.coffee))
return[];

return b.coffee.map(id=>{

return db.coffeeCategories.find(
x=>x.id===id
)?.name;

}).filter(Boolean);

}

function saveBooking(){

const clientId=
document.getElementById("bookingClient").value;

const startDate=
document.getElementById("bookingStartDate").value;

const endDate=
document.getElementById("bookingEndDate").value;

const startTime=
document.getElementById("bookingStartTime").value;

const endTime=
document.getElementById("bookingEndTime").value;

const price=
Number(
document.getElementById("bookingPrice").value||0
);

const paid=
Number(
document.getElementById("bookingPaid").value||0
);

const status=
document.getElementById("bookingStatus").value;

const notes=
document.getElementById("bookingNotes").value.trim();

const coffee=
[...document.getElementById("bookingCoffee").selectedOptions]
.map(o=>o.value);

if(!clientId||!startDate||!endDate){

alert("أكمل بيانات الحجز");

return;

}

const b={

id:editingBookingId||
Date.now().toString(),

clientId,

startDate,
startTime,

endDate,
endTime,

price,
paid,
status,
notes,
coffee

};

const index=db.bookings.findIndex(
x=>x.id===b.id
);

if(index>=0)
db.bookings[index]=b;
else
db.bookings.push(b);

persist();

closeBookingModal();

render();

}

function calendar(){

const y=currentCalendar.getFullYear();
const m=currentCalendar.getMonth();

const first=new Date(y,m,1);
const last=new Date(y,m+1,0);

const monthName=
first.toLocaleDateString(
"ar-SA",
{
month:"long",
year:"numeric"
}
);

let cells="";

const startDay=first.getDay();

for(let i=0;i<startDay;i++){

cells+=`<div></div>`;

}

for(let d=1;d<=last.getDate();d++){

const date=
formatDateForInput(
new Date(y,m,d)
);

const bookingsOnDay=
db.bookings.filter(
b=>date>=b.startDate&&
date<=b.endDate&&
b.status!=="cancelled"
);

const jsDay=
new Date(y,m,d).getDay();

const weekend=
jsDay===4||jsDay===5;

const booked=
bookingsOnDay.length>0;

cells+=`

<div class="day
${booked?"booked":"available"}
${weekend?"weekend":""}"
onclick="calendarDay('${date}')">

<div class="day-number">${d}</div>

${
bookingsOnDay
.slice(0,2)
.map(b=>{

const c=db.clients.find(
x=>x.id===b.clientId
);

return`
<div class="day-booking">
${safe(c?.name||"حجز")}
</div>
`;

})
.join("")
}

</div>

`;

}

async function shareDocument(filename,html,title){

try{

const blob=new Blob(
[`
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<body>${html}</body>
</html>
`],
{type:"text/html"}
);

const file=new File(
[blob],
filename,
{type:"text/html"}
);

if(
navigator.share&&
navigator.canShare&&
navigator.canShare({files:[file]})
){

await navigator.share({
title,
files:[file]
});

return;

}

}catch(e){}

printDocument(title,html);

}

style="width:100%;margin-bottom:8px"

}

function settingSwitch(key,label){

return`

<div class="check-row">

<span>${label}</span>

<button
class="switch ${db.settings[key]?"on":""}"
onclick="toggleSetting('${key}')">
</button>

</div>

`;

}

function toggleSetting(key){

db.settings[key]=!db.settings[key];

persist();

render();

}

/* =========================================================
   BACKUP
========================================================= */

function exportData(){

const blob=new Blob(
[JSON.stringify(db,null,2)],
{type:"application/json"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=
`rawana-backup-${Date.now()}.json`;

a.click();

URL.revokeObjectURL(url);

}

function importData(){

const input=document.createElement("input");

input.type="file";

input.accept=".json";

input.onchange=e=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=event=>{

try{

const imported=
JSON.parse(event.target.result);

if(!imported)
throw new Error();

db={
...JSON.parse(
JSON.stringify(defaults)
),
...imported,
settings:{
...defaults.settings,
...(imported.settings||{})
}
};

persist();

render();

alert("تم استيراد النسخة الاحتياطية");

}catch(err){

alert("ملف النسخة الاحتياطية غير صالح");

}

};

reader.readAsText(file);

};

input.click();

}

function resetAllData(){

if(!confirm(
"سيتم حذف جميع بيانات التطبيق. هل أنت متأكد؟"
))
return;

if(!confirm(
"تأكيد نهائي: حذف جميع البيانات؟"
))
return;

db=
JSON.parse(
JSON.stringify(defaults)
);

persist();

render();

}

else if(page==="settings")

}

/* =========================================================
   START
========================================================= */

render();

</script>
