<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#76243a">
<title>روانا 2.0</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

:root{
  --primary:#76243a;
  --primary-dark:#57182a;
  --primary-light:#f5e9ed;
  --bg:#f6f5f6;
  --card:#fff;
  --text:#222;
  --muted:#858585;
  --border:#e9e5e7;
  --success:#248b61;
  --success-light:#e8f6ef;
  --warning:#b87919;
  --warning-light:#fff5df;
  --danger:#c53d4d;
  --danger-light:#fdebed;
  --shadow:0 8px 28px rgba(0,0,0,.06);
  --radius:18px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tajawal,Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

.app{
  min-height:100vh;
  padding-bottom:85px;
}

/* TOP */
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(145deg,var(--primary),var(--primary-dark));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
  box-shadow:0 6px 15px rgba(118,36,58,.22);
}
.brand-title{font-size:18px;font-weight:800}
.brand-sub{font-size:11px;color:var(--muted);margin-top:1px}

.top-actions{display:flex;gap:7px}
.icon-btn{
  width:40px;height:40px;border-radius:13px;
  background:#f5f3f4;color:var(--primary);
  font-size:18px;
}

/* CONTENT */
.content{
  width:min(1180px,100%);
  margin:auto;
  padding:18px 14px 30px;
}
.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:18px;
}
.page-title{font-size:24px;font-weight:800}
.page-desc{font-size:12px;color:var(--muted);margin-top:4px}
.primary-btn{
  background:linear-gradient(145deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:12px 16px;
  border-radius:13px;
  font-weight:700;
  box-shadow:0 6px 18px rgba(118,36,58,.18);
}
.secondary-btn{
  background:var(--primary-light);
  color:var(--primary);
  padding:11px 14px;
  border-radius:12px;
  font-weight:700;
}
.danger-btn{
  background:var(--danger-light);
  color:var(--danger);
  padding:10px 13px;
  border-radius:11px;
  font-weight:700;
}

/* CARDS */
.grid{
  display:grid;
  gap:12px;
}
.stats{
  grid-template-columns:repeat(2,1fr);
}
@media(min-width:700px){
  .stats{grid-template-columns:repeat(4,1fr)}
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.stat{
  padding:16px;
  position:relative;
  overflow:hidden;
}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:22px;font-weight:800;margin-top:8px}
.stat-small{font-size:11px;color:var(--muted);margin-top:4px}
.stat-icon{
  position:absolute;
  left:13px;
  top:13px;
  width:35px;height:35px;
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-light);
  color:var(--primary);
}

/* DASHBOARD */
.section{
  margin-top:20px;
}
.section-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:11px;
}
.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.quick{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 13px;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:right;
}
.quick-icon{
  width:40px;height:40px;
  border-radius:13px;
  background:var(--primary-light);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
}
.quick b{display:block;font-size:13px}
.quick span{font-size:10px;color:var(--muted)}

.booking-list{display:grid;gap:10px}
.booking-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
  padding:14px;
}
.booking-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.booking-name{font-weight:800;font-size:15px}
.booking-phone{font-size:11px;color:var(--muted);margin-top:3px}
.booking-date{
  background:var(--primary-light);
  color:var(--primary);
  border-radius:11px;
  padding:7px 9px;
  font-size:11px;
  white-space:nowrap;
  text-align:center;
}
.booking-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}
.tag{
  background:#f6f6f6;
  border-radius:9px;
  padding:6px 8px;
  font-size:10px;
  color:#666;
}
.booking-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
  border-top:1px solid #eee;
  padding-top:10px;
}
.small-btn{
  padding:8px 10px;
  border-radius:10px;
  background:#f5f3f4;
  color:var(--primary);
  font-size:11px;
  font-weight:700;
}

/* TABLE / LIST */
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.search{
  flex:1;
  min-width:180px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px 14px;
  outline:none;
}
.search:focus{border-color:var(--primary)}

.empty{
  background:#fff;
  border:1px dashed #d8d2d5;
  border-radius:18px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}
.empty-icon{font-size:30px;margin-bottom:10px}

/* FORMS */
.form-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:11px;
}
@media(min-width:700px){
  .form-grid.two{grid-template-columns:repeat(2,1fr)}
  .form-grid.three{grid-template-columns:repeat(3,1fr)}
}
.field label{
  display:block;
  font-size:11px;
  color:#666;
  margin-bottom:6px;
  font-weight:700;
}
.field input,.field select,.field textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fafafa;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:13px;
}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--primary);
  background:#fff;
}
.form-section{
  background:#faf9fa;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-top:12px;
}
.form-section-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:11px;
}
.form-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}
.form-actions button{flex:1}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal.show{display:flex}
.modal-box{
  background:#fff;
  width:100%;
  max-width:760px;
  max-height:94vh;
  overflow:auto;
  border-radius:23px 23px 0 0;
  padding:18px;
}
@media(min-width:700px){
  .modal{align-items:center}
  .modal-box{border-radius:22px;max-height:90vh}
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.modal-title{font-size:18px;font-weight:800}
.close{
  width:35px;height:35px;
  border-radius:11px;
  background:#f4f2f3;
  color:#555;
}

/* ITEMS */
.item-row{
  display:grid;
  grid-template-columns:1fr 65px 80px 35px;
  gap:6px;
  align-items:center;
  background:#fff;
  border:1px solid var(--border);
  padding:7px;
  border-radius:12px;
  margin-bottom:7px;
}
.item-row input,.item-row select{
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 5px;
  font-size:11px;
}
.remove-item{
  width:30px;height:30px;border-radius:9px;
  background:var(--danger-light);
  color:var(--danger);
}
.add-item{
  width:100%;
  padding:10px;
  border-radius:11px;
  background:var(--primary-light);
  color:var(--primary);
  font-weight:700;
}

/* CALENDAR */
.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.month-nav{
  display:flex;gap:6px;
}
.month-btn{
  width:37px;height:37px;border-radius:11px;
  background:#f2eff0;color:var(--primary);
}
.calendar-title{font-size:17px;font-weight:800}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.weekday{
  text-align:center;
  font-size:10px;
  color:var(--muted);
  padding:7px 0;
  font-weight:700;
}
.day{
  min-height:68px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  padding:6px;
  position:relative;
}
.day.other{opacity:.35}
.day.thursday,.day.friday{
  background:#fff8dc;
}
.day.today{
  box-shadow:inset 0 0 0 2px var(--primary);
}
.day-num{font-size:11px;font-weight:800}
.day-booking{
  margin-top:5px;
  background:var(--primary);
  color:#fff;
  border-radius:5px;
  padding:3px 4px;
  font-size:8px;
  overflow:hidden;
  white-space:nowrap;
}
.day.available{
  border-color:#dfeee7;
}

/* SETTINGS */
.setting-list{display:grid;gap:10px}
.setting-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
}
.setting-title{
  font-weight:800;
  margin-bottom:4px;
}
.setting-desc{
  color:var(--muted);
  font-size:10px;
  margin-bottom:12px;
}
.switch-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:8px 0;
}
.switch{
  width:46px;height:26px;
  border-radius:20px;
  background:#ddd;
  padding:3px;
}
.switch i{
  display:block;
  width:20px;height:20px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}
.switch.on{background:var(--primary)}
.switch.on i{transform:translateX(-20px)}

.settings-nav{
  display:flex;
  overflow:auto;
  gap:7px;
  padding-bottom:4px;
  margin-bottom:13px;
}
.settings-tab{
  flex:none;
  background:#eee;
  border-radius:10px;
  padding:9px 12px;
  font-size:11px;
  font-weight:700;
}
.settings-tab.active{
  background:var(--primary);
  color:#fff;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  bottom:0;
  right:0;
  left:0;
  height:76px;
  z-index:60;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;
  max-width:90px;
  color:#8b8889;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border-radius:12px;
  background:transparent;
}
.nav-item.active{
  color:var(--primary);
  background:var(--primary-light);
}
.nav-icon{font-size:18px}
.nav-text{font-size:9px;font-weight:700}

/* TOAST */
.toast{
  position:fixed;
  z-index:200;
  bottom:92px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:#fff;
  border-radius:13px;
  padding:11px 15px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* REPORT */
.report-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
}
.report-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #f1eef0;
  font-size:12px;
}
.report-row:last-child{border:0}
.report-row b{font-size:13px}

/* COLORS */
.color-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.color-row input[type=color]{
  width:50px;
  height:38px;
  padding:2px;
}

/* PRINT */
@media print{
  body{background:#fff}
  .topbar,.bottom,.no-print{display:none!important}
  .content{padding:0}
  .card,.booking-card,.report-box{box-shadow:none}
}

/* DESKTOP */
@media(min-width:900px){
  .bottom{
    right:auto;
    width:240px;
    height:100vh;
    top:0;
    bottom:0;
    flex-direction:column;
    justify-content:flex-start;
    padding:90px 12px 20px;
    border-top:0;
    border-left:1px solid var(--border);
  }
  [dir=rtl] .bottom{
    left:auto;
    right:0;
    border-left:0;
    border-right:1px solid var(--border);
  }
  .nav-item{
    max-width:none;
    width:100%;
    height:48px;
    flex:none;
    flex-direction:row;
    justify-content:flex-start;
    padding:0 15px;
    gap:12px;
  }
  .app{padding-bottom:0}
  .content{padding-right:265px}
  [dir=rtl] .content{padding-left:20px;padding-right:265px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="logo">ر</div>
    <div>
      <div class="brand-title" id="brandName">روانا</div>
      <div class="brand-sub" id="brandSub">إدارة الشاليه</div>
    </div>
  </div>

  <div class="top-actions">
    <button class="icon-btn" onclick="openSearch()">⌕</button>
    <button class="icon-btn" onclick="showPage('settings')">⚙</button>
  </div>
</header>

<main class="content" id="content"></main>

<nav class="bottom" id="bottomNav"></nav>

</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   روانا 2.0
   نظام إدارة شاليه - Offline / LocalStorage
========================================================= */

const DB_KEY = "rawana_2_0_database";

const DEFAULT_CONTRACT = `
أقر أنا العميل {العميل}، رقم الجوال {الجوال}، بحجز {اسم_الشالية}
خلال الفترة من {الدخول} إلى {الخروج}.

قيمة الحجز التشغيلية: {إجمالي_التشغيل} {العملة}
المبلغ المدفوع: {المدفوع} {العملة}
المتبقي: {المتبقي} {العملة}

التأمين:
{التأمين}

القهوة:
{القهوة}

الخدمات:
{الخدمات}

وألتزم بالمحافظة على ممتلكات المكان وتسليمه بالحالة التي استلمته بها.

ملاحظات:
{ملاحظات}
`;

const DEFAULT_WA = `
السلام عليكم {العميل} 🌹

تم تأكيد حجزكم في {اسم_الشالية}.

📅 الدخول:
{الدخول}

📅 الخروج:
{الخروج}

💰 قيمة الحجز:
{إجمالي_التشغيل} {العملة}

💳 المدفوع:
{المدفوع} {العملة}

💵 المتبقي:
{المتبقي} {العملة}

{التأمين}

{القهوة}

{الخدمات}

نتمنى لكم إقامة سعيدة 🤍
`;

const DEFAULT_REVIEW =
`يعطيكم العافية {العميل} 🌿

سعدنا جدًا باستضافتكم في {اسم_الشالية}، ونتمنى إن تجربتكم كانت جميلة 🤍

إذا ما عليكم أمر، يسعدنا تقييمكم لنا ⭐

شكرًا لكم.`;

const DEFAULT_REMINDER =
`السلام عليكم {العميل} 🌹

نذكركم بموعد حجزكم في {اسم_الشالية}.

📅 الدخول: {الدخول}
📅 الخروج: {الخروج}

حياكم الله 🤍`;

/* -------------------------
   DEFAULT DATABASE
------------------------- */

function defaultDB(){
  return {
    settings:{
      name:"روانا",
      subtitle:"إدارة الشاليه",
      currency:"ر.س",
      primary:"#76243a",
      primaryDark:"#57182a",
      primaryLight:"#f5e9ed",
      bg:"#f6f5f6",
      defaultStart:"16:00",
      defaultEnd:"04:00",
      defaultChaletDeposit:0,
      defaultCoffeeDeposit:0,
      signature:true,
      contractTitle:"عقد حجز الشاليه",
      contractText:DEFAULT_CONTRACT,
      whatsappConfirm:DEFAULT_WA,
      whatsappReminder:DEFAULT_REMINDER,
      whatsappReview:DEFAULT_REVIEW,
      calendarThursday:"#fff8dc",
      calendarFriday:"#fff8dc",
      showDeposits:true,
      showCoffee:true,
      showServices:true
    },

    statuses:[
      {id:"confirmed",name:"مؤكد",active:true},
      {id:"pending",name:"معلق",active:true},
      {id:"completed",name:"مكتمل",active:true},
      {id:"cancelled",name:"ملغي",active:true}
    ],

    coffee:[
      {id:id(),name:"قهوة عربية",price:10,active:true},
      {id:id(),name:"شاي",price:8,active:true},
      {id:id(),name:"ماء",price:2,active:true}
    ],

    services:[
      {id:id(),name:"ضيافة",price:50,active:true,whatsapp:true},
      {id:id(),name:"تنسيق",price:100,active:true,whatsapp:true}
    ],

    bookings:[],
    clients:[],
    expenses:[],
    invoices:[],
    contracts:[]
  };
}

let db = loadDB();
let currentPage = "home";
let settingsTab = "general";
let calendarDate = new Date();
let toastTimer = null;

/* -------------------------
   STORAGE
------------------------- */

function loadDB(){
  try{
    const saved = localStorage.getItem(DB_KEY);
    if(!saved) return defaultDB();

    const parsed = JSON.parse(saved);
    const base = defaultDB();

    return {
      ...base,
      ...parsed,
      settings:{...base.settings,...(parsed.settings||{})},
      statuses:parsed.statuses||base.statuses,
      coffee:parsed.coffee||[],
      services:parsed.services||[],
      bookings:parsed.bookings||[],
      clients:parsed.clients||[],
      expenses:parsed.expenses||[],
      invoices:parsed.invoices||[],
      contracts:parsed.contracts||[]
    };
  }catch(e){
    return defaultDB();
  }
}

function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
  updateTheme();
}

function id(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

/* -------------------------
   HELPERS
------------------------- */

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(v){
  return Number(v||0).toLocaleString("ar-SA")+" "+db.settings.currency;
}

function num(v){
  return Number(v)||0;
}

function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function fmtDate(v){
  if(!v)return "-";
  const d=new Date(v+"T00:00:00");
  if(isNaN(d))return v;
  return d.toLocaleDateString("ar-SA",{
    year:"numeric",
    month:"long",
    day:"numeric"
  });
}

function fmtShort(v){
  if(!v)return "-";
  const d=new Date(v+"T00:00:00");
  return d.toLocaleDateString("ar-SA",{month:"short",day:"numeric"});
}

function time12(v){
  if(!v)return "-";
  const [h,m]=v.split(":").map(Number);
  const ap=h>=12?"م":"ص";
  const hh=h%12||12;
  return `${hh}:${String(m).padStart(2,"0")} ${ap}`;
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2600);
}

function activeStatuses(){

function getClient(idv){

function ensureClient(name,phone){
  let c=db.clients.find(x=>
    (phone&&x.phone===phone) ||
    (!phone&&x.name===name)
  );

  if(c){
    c.name=name;
    c.phone=phone;
    return c;
  }

  c={id:id(),name,phone,created:Date.now()};
  db.clients.push(c);
  return c;
}

/* -------------------------
   BOOKING CALCULATIONS
------------------------- */

/*
  التشغيل = الشاليه + القهوة + الخدمات
  التأمين منفصل تمامًا
  المتبقي لا يشمل التأمين
*/

function coffeeItems(b){
  return Array.isArray(b.coffeeItems)?b.coffeeItems:[];
}

function serviceItems(b){
  return Array.isArray(b.serviceItems)?b.serviceItems:[];
}

function coffeeTotal(b){
  return coffeeItems(b).reduce((s,x)=>s+num(x.qty)*num(x.price),0);
}

function servicesTotal(b){
  return serviceItems(b).reduce((s,x)=>s+num(x.qty)*num(x.price),0);
}

function chaletTotal(b){
  return num(b.price);
}

function operatingTotal(b){
  return chaletTotal(b)+coffeeTotal(b)+servicesTotal(b);
}

function chaletDeposit(b){
  return num(b.chaletDeposit);
}

function coffeeDeposit(b){
  return num(b.coffeeDeposit);
}

function depositTotal(b){
  return chaletDeposit(b)+coffeeDeposit(b);
}

function paidOperating(b){
  return Math.min(
    operatingTotal(b),
    num(b.paid)
  );
}

function remainingOperating(b){
  return Math.max(
    0,
    operatingTotal(b)-paidOperating(b)
  );
}

function bookingGrandTotal(b){
  return operatingTotal(b)+depositTotal(b);
}

function totalPaidIncludingDeposit(b){
  return num(b.paid)+num(b.depositPaid||0);
}

/* -------------------------
   DATE / OVERLAP
------------------------- */

function bookingStart(b){
  return new Date(`${b.startDate}T${b.startTime||db.settings.defaultStart}`);
}

function bookingEnd(b){
  let d=new Date(`${b.endDate}T${b.endTime||db.settings.defaultEnd}`);
  if(d<=bookingStart(b)) d.setDate(d.getDate()+1);
  return d;
}

function overlap(a,b,ignoreId=""){
  if(a.id===ignoreId)return false;
  const s1=bookingStart(a);
  const e1=bookingEnd(a);
  const s2=bookingStart(b);
  const e2=bookingEnd(b);

  return s1<e2 && s2<e1;
}

function hasOverlap(candidate,ignoreId=""){
  return db.bookings.some(b=>
    b.status!=="cancelled" &&
    candidate.status!=="cancelled" &&
    overlap(candidate,b,ignoreId)
  );
}

function pageHome(){
  const now=new Date();
  const month=now.getMonth();
  const year=now.getFullYear();

  const monthBookings=db.bookings.filter(b=>{
    const d=new Date(b.startDate+"T00:00:00");
    return d.getMonth()===month &&
           d.getFullYear()===year &&
           b.status!=="cancelled";
  });

  const revenue=monthBookings.reduce((s,b)=>s+operatingTotal(b),0);
  const collected=monthBookings.reduce((s,b)=>s+paidOperating(b),0);
  const remaining=monthBookings.reduce((s,b)=>s+remainingOperating(b),0);
  const deposits=monthBookings.reduce((s,b)=>s+depositTotal(b),0);

  const expenses=db.expenses
    .filter(x=>{
      const d=new Date(x.date+"T00:00:00");
      return d.getMonth()===month && d.getFullYear()===year;
    })
    .reduce((s,x)=>s+num(x.amount),0);

  const profit=revenue-expenses;

  const upcoming=db.bookings
    .filter(b=>b.status!=="cancelled" && bookingEnd(b)>=now)
    .sort((a,b)=>bookingStart(a)-bookingStart(b))
    .slice(0,5);

    </div>

      ${stat("إيرادات الشهر",money(revenue),"▣")}
      ${stat("المحصل",money(collected),"✓")}
      ${stat("المتبقي",money(remaining),"◷")}
      ${stat("الربح التشغيلي",money(profit),"↗")}
    </div>

    <div class="grid stats" style="margin-top:12px">
      ${stat("التأمينات",money(deposits),"◉")}
      ${stat("المصروفات",money(expenses),"−")}
      ${stat("الحجوزات",monthBookings.length,"#")}
      ${stat("القهوة",money(monthBookings.reduce((s,b)=>s+coffeeTotal(b),0)),"☕")}
    </div>

    <section class="section">
      <div class="section-title">اختصارات</div>
      <div class="quick-grid">
        <button class="quick" onclick="openBooking()">
          <div class="quick-icon">＋</div>
          <div><b>حجز جديد</b><span>إضافة حجز</span></div>
        </button>

        </button>

function filterBookings(){
  const q=(document.getElementById("bookingSearch")?.value||"").trim().toLowerCase();
  const st=document.getElementById("bookingStatus")?.value||"";

  const arr=db.bookings
    .filter(b=>
      (!q ||
        String(b.clientName||"").toLowerCase().includes(q) ||
        String(b.phone||"").includes(q)
      ) &&
      (!st||b.status===st)
    )
    .sort((a,b)=>bookingStart(b)-bookingStart(a));

  const el=document.getElementById("bookingResults");
  if(!el)return;

  el.innerHTML=arr.length
    ? arr.map(bookingCard).join("")
    : empty("لا توجد حجوزات","▣");

function refreshBookingSummary(){

  const chalet=num(document.getElementById("bPrice")?.value);
  const paid=num(document.getElementById("bPaid")?.value);

  const coffee=collectCoffeeRows().reduce((s,x)=>s+x.qty*x.price,0);
  const services=collectServiceRows().reduce((s,x)=>s+x.qty*x.price,0);

  const cd=num(document.getElementById("bChaletDeposit")?.value);
  const fd=num(document.getElementById("bCoffeeDeposit")?.value);

  const operating=chalet+coffee+services;
  const deposits=cd+fd;
  const remaining=Math.max(0,operating-paid);

  el.innerHTML=`
    <div class="report-row"><span>الشاليه</span><b>${money(chalet)}</b></div>
    <div class="report-row"><span>القهوة</span><b>${money(coffee)}</b></div>
    <div class="report-row"><span>الخدمات</span><b>${money(services)}</b></div>

function saveBooking(editId){
  const name=document.getElementById("bName").value.trim();
  const phone=normalizeSaudiPhone(document.getElementById("bPhone").value);

  if(!name){
    toast("اكتب اسم العميل");
    return;
  }

  const b={
    id:editId||id(),
    clientName:name,
    phone,
    startDate:document.getElementById("bStartDate").value,
    startTime:document.getElementById("bStartTime").value,
    endDate:document.getElementById("bEndDate").value,
    endTime:document.getElementById("bEndTime").value,
    price:num(document.getElementById("bPrice").value),
    paid:num(document.getElementById("bPaid").value),
    chaletDeposit:num(document.getElementById("bChaletDeposit")?.value),
    coffeeDeposit:num(document.getElementById("bCoffeeDeposit")?.value),
    status:document.getElementById("bStatus").value,
    coffeeItems:collectCoffeeRows(),
    serviceItems:collectServiceRows(),
    notes:document.getElementById("bNotes").value,
    updated:Date.now()
  };

  if(!b.startDate||!b.endDate){
    toast("حدد تاريخ الدخول والخروج");
    return;
  }

  if(bookingEnd(b)<=bookingStart(b)){
    toast("وقت الخروج غير صحيح");
    return;
  }

  if(b.paid>operatingTotal(b)){
    toast("المدفوع التشغيلي لا يمكن أن يتجاوز قيمة التشغيل");
    return;
  }

  if(hasOverlap(b,editId)){
    toast("⚠️ يوجد حجز متعارض مع هذا الموعد");
    return;
  }

  ensureClient(name,phone);

  if(editId){
    const i=db.bookings.findIndex(x=>x.id===editId);
    if(i>=0)db.bookings[i]=b;
  }else{
    b.created=Date.now();
    db.bookings.push(b);
  }

  saveDB();
  closeModal();
  toast(editId?"تم تحديث الحجز":"تم إضافة الحجز");
  showPage("bookings");
}

/* -------------------------
   CALENDAR
------------------------- */

function pageCalendar(){
  renderCalendar();
}

function renderCalendar(){
  const y=calendarDate.getFullYear();
  const m=calendarDate.getMonth();

  const monthName=new Intl.DateTimeFormat("ar-SA",{
    month:"long",
    year:"numeric"
  }).format(calendarDate);

  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);

  /*
    JS:
    الأحد 0
    الاثنين 1
    الثلاثاء 2
    الأربعاء 3
    الخميس 4
    الجمعة 5
    السبت 6
  */

  let start=first.getDay();
  let total=Math.ceil((start+last.getDate())/7)*7;

  const days=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

  let html=`
    <div class="page-head">
      <div>
        <div class="page-title">التقويم</div>
        <div class="page-desc">مواعيد الدخول والخروج</div>
      </div>
      <button class="primary-btn" onclick="openBooking()">+ حجز</button>
    </div>

    <div class="card" style="padding:13px">
      <div class="calendar-head">
        <button class="month-btn" onclick="changeMonth(-1)">‹</button>
        <div class="calendar-title">${monthName}</div>
        <button class="month-btn" onclick="changeMonth(1)">›</button>
      </div>

      <div class="calendar">
        ${days.map(x=>`<div class="weekday">${x}</div>`).join("")}
  `;

  for(let i=0;i<total;i++){
    const dayNum=i-start+1;

    if(dayNum<1||dayNum>last.getDate()){
      html+=`<div class="day other"></div>`;
      continue;
    }

    const date=`${y}-${String(m+1).padStart(2,"0")}-${String(dayNum).padStart(2,"0")}`;
    const d=new Date(date+"T00:00:00");
    const weekday=d.getDay();

    const isToday=date===todayISO();

    const dayBookings=db.bookings.filter(b=>
      b.status!=="cancelled" &&
      date>=b.startDate &&
      date<=b.endDate
    );

    html+=`
      <button
        class="day
          ${weekday===4?"thursday":""}
          ${weekday===5?"friday":""}
          ${isToday?"today":""}
          ${!dayBookings.length?"available":""}"
        onclick="calendarDay('${date}')">

        <div class="day-num">${dayNum}</div>

        ${dayBookings.slice(0,2).map(b=>`
          <div class="day-booking">${esc(b.clientName)}</div>
        `).join("")}

        ${
          dayBookings.length>2
          ? `<div style="font-size:8px;margin-top:3px">+${dayBookings.length-2}</div>`
          :""
        }
      </button>
    `;
  }

  html+=`</div></div>`;

  document.getElementById("content").innerHTML=html;
}

function changeMonth(n){
  calendarDate.setMonth(calendarDate.getMonth()+n);
  renderCalendar();
}

function calendarDay(date){
  const arr=db.bookings.filter(b=>
    b.status!=="cancelled" &&
    date>=b.startDate &&
    date<=b.endDate
  );

  document.getElementById("modalBox").innerHTML=`
    <div class="modal-head">
      <div class="modal-title">${fmtDate(date)}</div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

function normalizeSaudiPhone(phone){
  let p=String(phone||"").replace(/\D/g,"");

  if(p.startsWith("00966"))p=p.slice(2);
  if(p.startsWith("966"))return p;
  if(p.startsWith("05"))return "966"+p.slice(1);
  if(p.startsWith("5")&&p.length===9)return "966"+p;

  return p;
}

function bookingDynamic(b){
  const deposits=depositTotal(b)
    ? `💳 التأمين:\n${money(depositTotal(b))}\nمسترد في حال عدم وجود أي أضرار في الشالية.`
    :"";

  const coffee=coffeeItems(b).length
    ? `☕ ركن القهوة:\n${coffeeItems(b).map(x=>
        `• ${x.name} × ${x.qty} — ${money(x.qty*x.price)}`
      ).join("\n")}\nالإجمالي: ${money(coffeeTotal(b))}`
    :"";

  const services=serviceItems(b).filter(x=>{
    const setting=db.services.find(s=>s.id===x.itemId);
    return !setting || setting.whatsapp!==false;
  });

  const serviceText=services.length
    ? `✨ الخدمات:\n${services.map(x=>
        `• ${x.name} × ${x.qty} — ${money(x.qty*x.price)}`
      ).join("\n")}\nالإجمالي: ${money(services.reduce((s,x)=>s+x.qty*x.price,0))}`
    :"";

  return {
    deposits,
    coffee,
    services
  };
}

function replacePlaceholders(text,b){
  const d=bookingDynamic(b);

  const map={
    "{العميل}":b.clientName,
    "{الجوال}":b.phone||"",
    "{اسم_الشالية}":db.settings.name,
    "{الدخول}":`${fmtDate(b.startDate)} - ${time12(b.startTime)}`,
    "{الخروج}":`${fmtDate(b.endDate)} - ${time12(b.endTime)}`,
    "{قيمة_الحجز}":money(chaletTotal(b)),
    "{القهوة}":d.coffee,
    "{الخدمات}":d.services,
    "{إجمالي_القهوة}":money(coffeeTotal(b)),
    "{إجمالي_الخدمات}":money(servicesTotal(b)),
    "{إجمالي_التشغيل}":money(operatingTotal(b)),
    "{التأمين}":d.deposits,
    "{تأمين_الشالية}":money(chaletDeposit(b)),
    "{تأمين_القهوة}":money(coffeeDeposit(b)),
    "{إجمالي_التأمين}":money(depositTotal(b)),
    "{إجمالي_الحجز}":money(bookingGrandTotal(b)),
    "{المدفوع}":money(paidOperating(b)),
    "{المتبقي}":money(remainingOperating(b)),
    "{العملة}":db.settings.currency,
    "{الحالة}":statusName(b.status),
    "{ملاحظات}":b.notes||""
  };

  let result=String(text||"");

  Object.entries(map).forEach(([k,v])=>{
    result=result.split(k).join(v||"");
  });

  return result.replace(/\n{3,}/g,"\n\n").trim();
}

function dynamicMissingSections(text,b){
  const d=bookingDynamic(b);
  let out=text;

  if(d.deposits && !text.includes(d.deposits)){
    out+="\n\n"+d.deposits;
  }

  if(d.coffee && !text.includes(d.coffee)){
    out+="\n\n"+d.coffee;
  }

  if(d.services && !text.includes(d.services)){
    out+="\n\n"+d.services;
  }

  return out.trim();
}

function buildWhatsApp(b,type){
  let template=db.settings.whatsappConfirm;

  if(type==="reminder")template=db.settings.whatsappReminder;
  if(type==="review")template=db.settings.whatsappReview;

  let text=replacePlaceholders(template,b);
  text=dynamicMissingSections(text,b);

  return text;
}

function sendWhatsApp(bid,type="confirm"){
  const b=db.bookings.find(x=>x.id===bid);
  if(!b)return;

  const phone=normalizeSaudiPhone(b.phone);

  if(!phone){
    toast("لا يوجد رقم جوال لهذا العميل");
    return;
  }

  const text=buildWhatsApp(b,type);
  const url=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

  window.open(url,"_blank");
}

function darken(hex,amount){
  const c=hex.replace("#","");
  const r=Math.max(0,parseInt(c.slice(0,2),16)-amount);
  const g=Math.max(0,parseInt(c.slice(2,4),16)-amount);
  const b=Math.max(0,parseInt(c.slice(4,6),16)-amount);
  return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function lighten(hex,amount){
  const c=hex.replace("#","");
  const r=Math.min(255,parseInt(c.slice(0,2),16)+amount);
  const g=Math.min(255,parseInt(c.slice(2,4),16)+amount);
  const b=Math.min(255,parseInt(c.slice(4,6),16)+amount);
  return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
}

        ${db.statuses.map(s=>`
          <div class="item-row" style="grid-template-columns:1fr 70px 35px">
            <input value="${esc(s.name)}"
              onchange="renameStatus('${s.id}',this.value)">

            <button class="small-btn"
              onclick="toggleStatus('${s.id}')">
              ${s.active?"فعال":"مخفي"}
            </button>

            <button class="remove-item"
              onclick="deleteStatus('${s.id}')">×</button>
          </div>
        `).join("")}
      </div>

      <button class="add-item" onclick="addStatus()">+ إضافة حالة</button>
    </div>
  `;
}

function renameStatus(idv,name){
  const s=db.statuses.find(x=>x.id===idv);
  if(s)s.name=name.trim()||s.name;
  saveDB();
}

function toggleStatus(idv){
  const s=db.statuses.find(x=>x.id===idv);
  if(s)s.active=!s.active;
  saveDB();
  renderSettingsTab();
}

function deleteStatus(idv){
  if(db.statuses.length<=1){
    toast("يجب إبقاء حالة واحدة على الأقل");
    return;
  }

  if(!confirm("حذف الحالة؟"))return;

  db.statuses=db.statuses.filter(x=>x.id!==idv);
  saveDB();
  renderSettingsTab();
}

function addStatus(){
  const name=prompt("اسم الحالة الجديدة");
  if(!name)return;

  db.statuses.push({
    id:id(),
    name:name.trim(),
    active:true
  });

  saveDB();
  renderSettingsTab();
}

function settingsData(el){
  el.innerHTML=`
    <div class="setting-card">
      <div class="setting-title">النسخ الاحتياطي</div>
      <div class="setting-desc">
        احفظ جميع بيانات روانا في ملف واحد، واستعدها لاحقًا.
      </div>

      <button class="primary-btn" onclick="backupData()">↓ تصدير نسخة احتياطية</button>

      <label class="secondary-btn" style="display:inline-block;margin-top:8px">
        ↑ استيراد نسخة
        <input type="file" accept=".json" onchange="restoreData(event)" hidden>
      </label>
    </div>

    <div class="setting-card" style="margin-top:10px">
      <div class="setting-title">إدارة البيانات</div>
      <div class="setting-desc">استخدمها بحذر.</div>

      <button class="danger-btn" onclick="resetAllData()">
        حذف جميع البيانات
      </button>
    </div>

    <div class="setting-card" style="margin-top:10px;text-align:center">
      <div style="font-size:22px;font-weight:800;color:var(--primary)">
        روانا 2.0
      </div>
      <div style="font-size:11px;color:#888;margin-top:4px">
        نظام إدارة الشاليه
      </div>
    </div>
  `;
}

/* -------------------------
   BACKUP
------------------------- */

function backupData(){
  const blob=new Blob(
    [JSON.stringify(db,null,2)],
    {type:"application/json"}
  );

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`روانا-نسخة-احتياطية-${todayISO()}.json`;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("تم تجهيز النسخة الاحتياطية");
}

function restoreData(event){
  const file=event.target.files?.[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);

      if(!data.settings||!Array.isArray(data.bookings)){
        throw new Error();
      }

      if(!confirm("استبدال البيانات الحالية بالنسخة؟"))return;

      db={
        ...defaultDB(),
        ...data,
        settings:{...defaultDB().settings,...data.settings}
      };

      saveDB();
      updateTheme();
      showPage("home");
      toast("تم استرجاع البيانات");
    }catch{
      toast("ملف النسخة الاحتياطية غير صالح");
    }
  };

  reader.readAsText(file);
}

function resetAllData(){
  if(!confirm("⚠️ سيتم حذف جميع الحجوزات والعملاء والمصروفات. هل أنت متأكد؟"))return;
  if(!confirm("تأكيد نهائي؟"))return;

  db=defaultDB();
  saveDB();
  updateTheme();
  showPage("home");
  toast("تمت إعادة ضبط البيانات");
}

/* -------------------------
   GLOBAL SEARCH
------------------------- */

function openSearch(){
  document.getElementById("modalBox").innerHTML=`
    <div class="modal-head">
      <div class="modal-title">بحث شامل</div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <input class="search" id="globalSearch"
      placeholder="اسم العميل، الجوال، الخدمة..."
      oninput="globalSearch()">

    <div id="globalResults" style="margin-top:12px"></div>
  `;

  document.getElementById("modal").classList.add("show");
  document.getElementById("globalSearch").focus();
}

function globalSearch(){
  const q=(document.getElementById("globalSearch")?.value||"").trim().toLowerCase();
  const el=document.getElementById("globalResults");

  if(!q){
    el.innerHTML=empty("ابدأ بالكتابة للبحث","⌕");
    return;
  }

  const results=db.bookings.filter(b=>
    b.clientName.toLowerCase().includes(q) ||
    String(b.phone||"").includes(q)
  ).slice(0,10);

  el.innerHTML=results.length
    ? `<div class="booking-list">${results.map(bookingCard).join("")}</div>`
    : empty("لا توجد نتائج","⌕");
}

/* -------------------------
   MODAL
------------------------- */

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeModal();
});

/* -------------------------
   START
------------------------- */

updateTheme();
renderNav();
showPage("home");

</script>
</body>
</html>
