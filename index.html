<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d1f35">
<title>روانا | إدارة الشالية</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap');

:root{
  --primary:#6d1f35;
  --primary-dark:#531528;
  --primary-light:#f6e9ed;
  --bg:#f5f3f2;
  --card:#ffffff;
  --text:#272326;
  --muted:#817b80;
  --border:#e9e4e5;
  --green:#21875b;
  --green-bg:#eaf7f0;
  --red:#c83d50;
  --red-bg:#fdecef;
  --orange:#c87824;
  --orange-bg:#fff3df;
  --blue:#3977bd;
  --blue-bg:#eaf2fb;
  --shadow:0 8px 30px rgba(35,20,27,.06);
  --radius:17px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tajawal,Arial,sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:250px;
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  background:#fff;
  border-left:1px solid var(--border);
  padding:22px 14px;
  z-index:100;
}

.logo{
  padding:8px 13px 25px;
}

.logo-title{
  color:var(--primary);
  font-size:29px;
  font-weight:800;
}

.logo-sub{
  color:var(--muted);
  font-size:12px;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  text-align:right;
  padding:12px 14px;
  border-radius:12px;
  color:#615b60;
  font-weight:700;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  color:var(--primary);
  background:var(--primary-light);
}

/* =========================
   MAIN
========================= */

main{
  width:calc(100% - 250px);
  margin-right:250px;
  padding:25px;
  max-width:1600px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.page-head h1{
  margin:0;
  font-size:26px;
}

.page-head p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  padding:10px 15px;
  border-radius:11px;
  font-weight:700;
}

.btn:hover{
  filter:brightness(.98);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.btn-danger{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

.btn-success{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.btn-light{
  background:#faf8f8;
}

/* =========================
   CARDS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:17px;
}

.stat{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.stat-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:var(--primary-light);
  color:var(--primary);
  border-radius:13px;
  font-size:19px;
}

.stat-title{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  display:block;
  font-size:25px;
  font-weight:800;
  margin-top:8px;
}

/* =========================
   LAYOUT
========================= */

.two-col{
  display:grid;
  grid-template-columns:1.45fr 1fr;
  gap:15px;
  margin-top:15px;
}

.three-col{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:15px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.section-title h3{
  margin:0;
  font-size:17px;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   LIST
========================= */

.list{
  display:grid;
  gap:9px;
}

.list-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  background:#fff;
}

.list-row-main{
  min-width:0;
}

.list-row-main strong{
  display:block;
}

.list-row-main small{
  color:var(--muted);
}

.row-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.badge.green{
  color:var(--green);
  background:var(--green-bg);
}

.badge.red{
  color:var(--red);
  background:var(--red-bg);
}

.badge.orange{
  color:var(--orange);
  background:var(--orange-bg);
}

.badge.blue{
  color:var(--blue);
  background:var(--blue-bg);
}

/* =========================
   TABLE
========================= */

.table-wrap{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,td{
  text-align:right;
  padding:13px;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

th{
  background:#faf8f8;
  color:#716b70;
}

tr:last-child td{
  border-bottom:0;
}

.empty{
  text-align:center;
  padding:35px;
  color:var(--muted);
}

/* =========================
   CALENDAR
========================= */

.calendar-card{
  padding:15px;
}

.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.calendar-head strong{
  font-size:19px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.weekday{
  text-align:center;
  color:var(--muted);
  font-weight:800;
  font-size:12px;
  padding:7px;
}

.day{
  min-height:105px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px;
  background:#fff;
  cursor:pointer;
}

.day:hover{
  border-color:#d3b3bc;
}

.day.weekend{
  background:#fffaf0;
}

.day.today{
  box-shadow:inset 0 0 0 2px var(--primary);
}

.day.booked{
  background:#fff7f8;
}

.day-number{
  font-weight:800;
}

.calendar-booking{
  margin-top:6px;
  background:var(--primary);
  color:#fff;
  border-radius:5px;
  padding:4px;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.52);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(780px,100%);
  max-height:93vh;
  overflow:auto;
  background:#fff;
  border-radius:21px;
  padding:21px;
}

.modal h2{
  margin:0 0 18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:grid;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  font-weight:800;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 11px;
  outline:0;
  background:#fff;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.modal-footer{
  display:flex;
  gap:8px;
  justify-content:flex-start;
  margin-top:18px;
}

/* =========================
   SERVICES
========================= */

.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.service-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
}

.service-card h3{
  margin:0 0 5px;
}

.service-price{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   OPERATIONS
========================= */

.checklist{
  display:grid;
  gap:8px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:11px;
}

.check-item input{
  width:17px;
  height:17px;
  accent-color:var(--primary);
}

.done{
  text-decoration:line-through;
  color:#999;
}

/* =========================
   MESSAGES
========================= */

.message-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:15px;
}

.message-list{
  display:grid;
  gap:7px;
}

.message-item{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  background:#fff;
  cursor:pointer;
}

.message-item.active{
  background:var(--primary-light);
  border-color:#d9aebb;
}

.message-item strong{
  display:block;
}

.message-item small{
  color:var(--muted);
}

.message-tools{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}

.variable{
  border:1px solid var(--border);
  background:#faf8f8;
  padding:7px 10px;
  border-radius:9px;
  font-size:11px;
}

.message-editor{
  width:100%;
  min-height:330px;
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px;
  line-height:1.9;
  resize:vertical;
}

.whatsapp-preview{
  margin-top:13px;
  background:#e9f8df;
  border-radius:15px;
  padding:15px;
  min-height:160px;
  white-space:pre-wrap;
  line-height:1.9;
}

/* =========================
   SEARCH
========================= */

.search{
  width:100%;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px;
  margin-bottom:12px;
  outline:0;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:20px;
  bottom:20px;
  background:#252225;
  color:#fff;
  padding:12px 17px;
  border-radius:11px;
  z-index:2000;
  display:none;
}

.toast.show{
  display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:950px){

  .sidebar{
    width:100%;
    height:63px;
    bottom:auto;
    padding:5px;
    border-left:0;
    border-bottom:1px solid var(--border);
  }

  .logo{
    display:none;
  }

  .nav{
    display:flex;
    overflow:auto;
  }

  .nav button{
    white-space:nowrap;
    padding:9px 11px;
  }

  main{
    width:100%;
    margin-right:0;
    padding:13px;
    margin-top:63px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .two-col,
  .three-col,
  .message-layout{
    grid-template-columns:1fr;
  }

  .service-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:560px){

  .page-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .service-grid{
    grid-template-columns:1fr;
  }

  .calendar{
    gap:3px;
  }

  .day{
    min-height:68px;
    padding:5px;
  }

  .calendar-booking{
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">
    <div class="logo-title">روانا</div>
    <div class="logo-sub">إدارة الشالية</div>
  </div>

  <nav class="nav" id="nav"></nav>

</aside>

<main>
  <div id="app"></div>
</main>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   RAWANA — DATA
========================================================= */

const STORAGE_KEY = "rawana_pro_v1";

const defaultData = {

  bookings: [],

  clients: [],

  services: [
    {
      id:1,
      name:"ركن القهوة",
      price:150,
      unit:"طلب",
      active:true
    }
  ],

  expenses: [],

  tasks: [],

  messages: [

    {
      id:"confirm",
      name:"تأكيد الحجز",
      text:
`السلام عليكم {name} 🌹

تم تأكيد حجزكم في روانا.

📅 الدخول:
{startDate}
🕐 {startTime}

📅 الخروج:
{endDate}
🕐 {endTime}

💰 قيمة الحجز:
{total} ر.س

💳 المدفوع:
{paid} ر.س

💵 المتبقي:
{remaining} ر.س

{services}`
    },

    {
      id:"before",
      name:"تذكير قبل الدخول",
      text:
`السلام عليكم {name} 🌿

نذكركم بأن موعد دخولكم إلى روانا غدًا.

📅 {startDate}
🕐 {startTime}

نتشرف باستضافتكم 🤍`
    },

    {
      id:"today",
      name:"رسالة يوم الدخول",
      text:
`حياكم الله {name} 🤍

موعد دخولكم اليوم إلى روانا:

📅 {startDate}
🕐 {startTime}

نتمنى لكم إقامة جميلة وسعيدة.`
    },

    {
      id:"balance",
      name:"تذكير المتبقي",
      text:
`السلام عليكم {name} 🌹

نذكركم بأن المبلغ المتبقي على الحجز:

💵 {remaining} ر.س

شاكرين لكم.`
    },

    {
      id:"checkout",
      name:"تذكير الخروج",
      text:
`يعطيكم العافية {name} 🤍

نذكركم بأن موعد الخروج من روانا:

📅 {endDate}
🕐 {endTime}

سعدنا باستضافتكم ونتمنى نشوفكم مرة أخرى.`
    },

    {
      id:"review",
      name:"طلب التقييم",
      text:
`يعطيكم العافية {name} 🌿

سعدنا جدًا باستضافتكم في روانا، ونتمنى أن تجربتكم كانت جميلة.

إذا ما عليك أمر، يسعدنا تقييمكم لنا ⭐

{reviewLink}`
    }

  ],

  settings:{
    chaletName:"روانا",
    checkin:"16:00",
    checkout:"04:00",
    reviewLink:""
  }

};

let data = loadData();

let currentPage = "home";

let selectedMessage = "confirm";

let calendarDate = new Date();


/* =========================================================
   STORAGE
========================================================= */

function loadData(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(!saved)
      return structuredClone(defaultData);

    const parsed = JSON.parse(saved);

    return {
      ...structuredClone(defaultData),
      ...parsed
    };

  }catch{

    return structuredClone(defaultData);

  }

}

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   HELPERS
========================================================= */

function money(value){

  return Number(value || 0)
    .toLocaleString("en-US") + " ر.س";

}

function dateText(date){

  if(!date) return "-";

  const [y,m,d] = date.split("-");

  return `${d}/${m}/${y}`;

}

function today(){

  const d = new Date();

  return d.toISOString().slice(0,10);

}

function showToast(text){

  const toast = document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}

function statusText(status){

  return {
    confirmed:"مؤكد",
    pending:"معلق",
    completed:"مكتمل",
    cancelled:"ملغي"
  }[status] || status;

}

function statusClass(status){

  if(status==="confirmed") return "green";

  if(status==="cancelled") return "red";

  if(status==="completed") return "blue";

  return "orange";

}


/* =========================================================
   NAVIGATION
========================================================= */

const navigation = [

  ["home","الرئيسية","⌂"],
  ["bookings","الحجوزات","▣"],
  ["calendar","التقويم","▦"],
  ["clients","العملاء","♙"],
  ["operations","التجهيز والتشغيل","✓"],
  ["services","الخدمات","✦"],
  ["messages","واتساب","◌"],
  ["finance","المالية","ر.س"],
  ["documents","الفواتير والعقود","▤"],
  ["reports","التقارير","◔"]

];

function drawNav(){

  document.getElementById("nav").innerHTML =
    navigation.map(item => `

      <button
        class="${currentPage===item[0] ? "active":""}"
        onclick="go('${item[0]}')">

        ${item[2]} &nbsp; ${item[1]}

      </button>

    `).join("");

}

function go(page){

  currentPage = page;

  drawNav();

  render();

}


/* =========================================================
   PAGE HEADER
========================================================= */

function header(title,subtitle,actions=""){

  return `

    <div class="page-head">

      <div>
        <h1>${title}</h1>
        <p>${subtitle || ""}</p>
      </div>

      <div class="actions">
        ${actions}
      </div>

    </div>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const pages = {

    home:homePage,
    bookings:bookingsPage,
    calendar:calendarPage,
    clients:clientsPage,
    operations:operationsPage,
    services:servicesPage,
    messages:messagesPage,
    finance:financePage,
    documents:documentsPage,
    reports:reportsPage

  };

  pages[currentPage]();

}


/* =========================================================
   HOME
========================================================= */

function homePage(){

  const bookings = data.bookings
    .filter(b => b.status!=="cancelled");

  const todayBookings = bookings.filter(
    b => b.startDate===today() || b.endDate===today()
  );

  const collected = bookings.reduce(
    (sum,b)=>sum+Number(b.paid||0),0
  );

  const remaining = bookings.reduce(
    (sum,b)=>sum+Number(b.remaining||0),0
  );

  const openTasks = data.tasks.filter(t=>!t.done);

  document.getElementById("app").innerHTML =

    header(
      "روانا",
      "لوحة التشغيل اليومية للشالية",
      `
      <button class="btn btn-primary"
        onclick="openBooking()">
        + حجز جديد
      </button>
      `
    )

    +

    `

    <div class="stats">

      <div class="card stat">
        <div>
          <div class="stat-title">حجوزات اليوم</div>
          <span class="stat-value">${todayBookings.length}</span>
        </div>
        <div class="stat-icon">📅</div>
      </div>

      <div class="card stat">
        <div>
          <div class="stat-title">المحصّل</div>
          <span class="stat-value">${money(collected)}</span>
        </div>
        <div class="stat-icon">💰</div>
      </div>

      <div class="card stat">
        <div>
          <div class="stat-title">المبالغ المتبقية</div>
          <span class="stat-value">${money(remaining)}</span>
        </div>
        <div class="stat-icon">💳</div>
      </div>

      <div class="card stat">
        <div>
          <div class="stat-title">مهام مفتوحة</div>
          <span class="stat-value">${openTasks.length}</span>
        </div>
        <div class="stat-icon">✓</div>
      </div>

    </div>

    <div class="two-col">

      <div class="card">

        <div class="section-title">
          <h3>حركة اليوم</h3>
          <span>${dateText(today())}</span>
        </div>

        <div class="list">

          ${
            todayBookings.length

            ?

            todayBookings.map(b => `

              <div class="list-row">

                <div class="list-row-main">

                  <strong>${b.clientName}</strong>

                  <small>
                    ${
                      b.startDate===today()
                      ? "دخول"
                      : "خروج"
                    }

                    ·

                    ${
                      b.startDate===today()
                      ? b.startTime
                      : b.endTime
                    }
                  </small>

                </div>

                <span class="badge ${statusClass(b.status)}">
                  ${statusText(b.status)}
                </span>

                <button
                  class="btn"
                  onclick="openBooking(${b.id})">

                  فتح

                </button>

/* =========================================================
   CALENDAR
========================================================= */

function calendarPage(){

  const y = calendarDate.getFullYear();

  const m = calendarDate.getMonth();

  const monthNames = [

    "يناير","فبراير","مارس","أبريل",
    "مايو","يونيو","يوليو","أغسطس",
    "سبتمبر","أكتوبر","نوفمبر","ديسمبر"

  ];

  const weekdays = [

    "الأحد",
    "الاثنين",
    "الثلاثاء",
    "الأربعاء",
    "الخميس",
    "الجمعة",
    "السبت"

  ];

  const firstDay =
    new Date(y,m,1).getDay();

  const days =
    new Date(y,m+1,0).getDate();

  let cells = "";

  for(let i=0;i<firstDay;i++)
    cells += "<div></div>";

  for(let d=1;d<=days;d++){

    const date =
      `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    const dow =
      new Date(y,m,d).getDay();

    const bookings =
      data.bookings.filter(b=>
        b.status!=="cancelled" &&
        b.startDate<=date &&
        b.endDate>=date
      );

    cells += `

      <div
        class="
          day
          ${dow===4||dow===5 ? "weekend":""}
          ${date===today() ? "today":""}
          ${bookings.length ? "booked":""}
        "
        onclick="openBooking(null,'${date}')">

        <div class="day-number">
          ${d}
        </div>

        ${
          bookings.slice(0,3).map(b=>`

            <div
              class="calendar-booking"
              onclick="event.stopPropagation();openBooking(${b.id})">

              ${b.clientName}

            </div>

          `).join("")
        }

      </div>

    `;

  }

  document.getElementById("app").innerHTML =

    header(
      "التقويم",
      "تقويم ميلادي لإدارة دخول وخروج الحجوزات"
    )

    +

    `

    <div class="card calendar-card">

      <div class="calendar-head">

        <button
          class="btn"
          onclick="
            calendarDate.setMonth(calendarDate.getMonth()-1);
            calendarPage()
          ">

          السابق

        </button>

        <strong>
          ${monthNames[m]} ${y}
        </strong>

        <button
          class="btn"
          onclick="
            calendarDate.setMonth(calendarDate.getMonth()+1);
            calendarPage()
          ">

          التالي

        </button>

      </div>

      <div class="calendar">

        ${weekdays.map(w=>
          `<div class="weekday">${w}</div>`
        ).join("")}

        ${cells}

      </div>

    </div>

    `;

}

function insertVariable(variable){

  const textarea =
    document.getElementById("messageText");

  const start =
    textarea.selectionStart;

  const end =
    textarea.selectionEnd;

  textarea.value =
    textarea.value.substring(0,start)
    +
    variable
    +
    textarea.value.substring(end);

  textarea.focus();

  textarea.selectionStart =
    textarea.selectionEnd =
    start+variable.length;

  updateMessagePreview();

}

function replaceVariables(text,b){

  const services =
    (b.services||[])
    .map(s=>`• ${s.name} — ${money(s.price)}`)
    .join("\n");

  return text

    .replaceAll("{name}",b.clientName||"العميل")
    .replaceAll("{startDate}",dateText(b.startDate))
    .replaceAll("{startTime}",b.startTime||"")
    .replaceAll("{endDate}",dateText(b.endDate))
    .replaceAll("{endTime}",b.endTime||"")
    .replaceAll("{total}",Number(b.total||0).toLocaleString("en-US"))
    .replaceAll("{paid}",Number(b.paid||0).toLocaleString("en-US"))
    .replaceAll("{remaining}",Number(b.remaining||0).toLocaleString("en-US"))
    .replaceAll("{services}",services)
    .replaceAll("{reviewLink}",data.settings.reviewLink||"");

}

function updateMessagePreview(){

  const textarea =
    document.getElementById("messageText");

  const preview =
    document.getElementById("messagePreview");

  if(!textarea||!preview)
    return;

  const sample =
    data.bookings[0]
    ||
    {
      clientName:"فهد",
      startDate:today(),
      startTime:data.settings.checkin,
      endDate:today(),
      endTime:data.settings.checkout,
      total:750,
      paid:300,
      remaining:450,
      services:[]
    };

  preview.textContent =
    replaceVariables(
      textarea.value,
      sample
    );

}

function saveMessage(){

    data.messages.find(m=>m.id===selectedMessage);

  if(!message)

  message.name =

function calculateBooking(){

  const base =
    Number(document.getElementById("bookingPrice")?.value||0);

  const paid =
    Number(document.getElementById("bookingPaid")?.value||0);

  const services =
    [...document.querySelectorAll(".bookingService:checked")]
    .map(el =>
      data.services.find(s=>Number(s.id)===Number(el.value))
    )
    .filter(Boolean);

  const servicesTotal =
    services.reduce(
      (sum,s)=>sum+Number(s.price||0),
      0
    );

  const total =
    base+servicesTotal;

  const remaining =
    Math.max(0,total-paid);

  const totalEl =
    document.getElementById("bookingTotal");

  const paidEl =
    document.getElementById("bookingPaidPreview");

  const remEl =
    document.getElementById("bookingRemaining");

  if(totalEl)
    totalEl.textContent=money(total);

  if(paidEl)
    paidEl.textContent=money(paid);

  if(remEl)
    remEl.textContent=money(remaining);

}

function saveBooking(id){

  const clientId =
    Number(document.getElementById("bookingClient").value||0);

  let name =
    document.getElementById("bookingName").value.trim();

  let phone =
    document.getElementById("bookingPhone").value.trim();

  if(clientId){

    const client =
      data.clients.find(c=>Number(c.id)===clientId);

    if(client){

      name=client.name;

      phone=client.phone||phone;

    }

  }

  if(!name){

    showToast("اكتب اسم العميل");

    return;

  }

  let client =
    data.clients.find(c=>
      Number(c.id)===clientId
      ||
      (
        c.name===name &&
        c.phone===phone
      )
    );

  if(!client){

    client={
      id:Date.now(),
      name,
      phone,
      note:""
    };

    data.clients.push(client);

  }

  const services =
    [...document.querySelectorAll(".bookingService:checked")]
    .map(el =>
      data.services.find(s=>Number(s.id)===Number(el.value))
    )
    .filter(Boolean);

  const basePrice =
    Number(document.getElementById("bookingPrice").value||0);

  const total =
    basePrice +
    services.reduce(
      (sum,s)=>sum+Number(s.price||0),
      0
    );

  const paid =
    Number(document.getElementById("bookingPaid").value||0);

  const booking = id
    ? data.bookings.find(b=>b.id===id)
    : {
        id:Date.now()
      };

  booking.clientId=client.id;
  booking.clientName=name;
  booking.phone=phone;

  booking.startDate =
    document.getElementById("bookingStart").value;

  booking.startTime =
    document.getElementById("bookingStartTime").value;

  booking.endDate =
    document.getElementById("bookingEnd").value;

  booking.endTime =
    document.getElementById("bookingEndTime").value;

  booking.basePrice=basePrice;

  booking.services=services;

  booking.total=total;

  booking.paid=paid;

  booking.remaining=
    Math.max(0,total-paid);

  booking.status =
    document.getElementById("bookingStatus").value;

  booking.note =
    document.getElementById("bookingNote").value;

  if(!id)
    data.bookings.push(booking);

  saveData();

  closeModal();

  showToast("تم حفظ الحجز");

  render();

}

/* =========================================================
   WHATSAPP
========================================================= */

function normalizeSaudiPhone(phone){

  let p =
    String(phone||"")
    .replace(/\D/g,"");

  if(p.startsWith("05"))
    p="966"+p.substring(1);

  if(p.startsWith("5"))
    p="966"+p;

  return p;

}

function sendWhatsApp(bookingId,messageId="confirm"){

  const booking =
    data.bookings.find(b=>b.id===bookingId);

  if(!booking){

    showToast("الحجز غير موجود");

    return;

  }

  const phone =
    normalizeSaudiPhone(booking.phone);

  if(!phone){

    showToast("لا يوجد رقم جوال للحجز");

    return;

  }

  const message =
    data.messages.find(m=>m.id===messageId)
    || data.messages[0];

  const text =
    replaceVariables(
      message.text,
      booking
    );

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(text)}`,
    "_blank"
  );

}

function showModal(){

    .classList.add("show");

}

  document
    .getElementById("modalOverlay")
    .classList.remove("show");

        closeModal();
    }
  );


/* =========================================================
   BACKUP
========================================================= */

function backupData(){

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    "rawana-backup.json";

  a.click();

  URL.revokeObjectURL(a.href);

  showToast("تم تجهيز النسخة الاحتياطية");

}

function restoreData(){

  const input =
    document.createElement("input");

  input.type="file";

  input.accept=".json";

  input.onchange=e=>{

    const file =
      e.target.files[0];

    if(!file)
      return;

    const reader =
      new FileReader();

    reader.onload=()=>{

      try{

        data =
          JSON.parse(reader.result);

        saveData();

        showToast("تمت استعادة البيانات");

        render();

      }catch{

        showToast("ملف غير صالح");

      }

    };

    reader.readAsText(file);

  };

  input.click();

}
